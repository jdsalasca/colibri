[package]
name = "colibri-dom"
version.workspace = true
edition.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
colibri-core = { path = "../colibri-core" }
colibri-ssr = { path = "../colibri-ssr" }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "=0.3.107", features = ["Comment", "Document", "Element", "Event", "EventTarget", "HtmlElement", "Node", "NodeList", "Text", "Window", "console"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
gloo-timers = { version = "0.3", features = ["futures"] }

[dev-dependencies]
colibri-macros = { path = "../colibri-macros" }

[lints]
workspace = true
